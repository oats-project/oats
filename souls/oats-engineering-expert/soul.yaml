schemaVersion: 2
name: oats-engineering-expert
description: The OATS engineering expert - a fresh instance leads one engineering effort (the kernel and CLI, the Terminal UI, the Desktop, the provider packages, operating a deployment, the docs) from plan to merge, reading each area's knowledge subject as the task needs, and owns the integration.
work: directory
# oats.core and the oats.okf knowledge slot come from the workspace defaults.
# The subjects this soul reads by default are in okf.json beside this file.
capabilities:
  oats.engineering-expert: { from: here }      # plan, spec, helpers, decide who builds, verify, land
  oats.build: { from: here }                   # the build skills, for the specs it builds itself
  oats.landing-rules: { from: here }           # how work lands here: the lane map, the agreements, who merges
  oats.workspace-experts: { from: here }       # this repository's surfaces, developers and delivery
  oats.setup: { from: package }                # onboarding, rebuilds, host delivery, teams and upgrades
  oats.desktop-ui: { from: here }              # accessible Desktop interactions and live Electron verification
launch: { harness: claude, model: claude-opus-5-5 }   # the role's preference; each machine may override it
