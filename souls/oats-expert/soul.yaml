schemaVersion: 2
name: oats-expert
description: "Deprecated: new work spawns oats-engineering-expert; this soul resolves until its removal in a change of its own. The generalist OATS expert - leads work that spans several areas, coordinates the domain experts and owns the integration."
work: directory
# oats.core and the oats.okf knowledge slot come from the workspace defaults.
# What this soul owns and reads in the central base is okf.json beside this file.
capabilities:
  oats.engineering-expert: { from: here }      # plan, spec, probe, coordinate developers, verify, land
  oats.landing-rules: { from: here }           # how work lands here: the lane map, the agreements, who merges
  oats.workspace-experts: { from: here }       # this repository's surfaces, developers and delivery
launch: { harness: claude, model: claude-opus-5-5 }   # the role's preference; each machine may override it
