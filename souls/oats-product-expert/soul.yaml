schemaVersion: 2
name: oats-product-expert
description: The OATS product expert - a fresh instance decides what and why with a person (vision, direction, users, positioning, research and trials, the README and the concept pages), writes the brief and hands it to an engineering expert at an exact version; dated, attributable research, no facts invented.
work: directory
# oats.core and the oats.okf knowledge slot come from the workspace defaults.
# The subjects this soul reads by default are in okf.json beside this file.
capabilities:
  oats.engineering-expert: { from: here }      # the expert method: plan, probe, hand off, ask a person, land
  oats.landing-rules: { from: here }           # how work lands here: the lane map, the agreements, who merges
launch: { harness: claude, model: claude-opus-5-5 }   # the role's preference; each machine may override it
