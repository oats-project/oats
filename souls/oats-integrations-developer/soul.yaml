schemaVersion: 2
name: oats-integrations-developer
description: "Deprecated: new work spawns oats-developer; this soul resolves until its removal in a change of its own. OATS integrations developer: owns the provider packages (oats-okf, oats-aweb, oats-jira, oats-linear, oats-authoring) and their mirrors and pins in the OATS repository."
# A developer: its product is reviewed changes on its own branch.
work: worktree
# oats.core and messaging come from the workspace defaults. A developer has no knowledge
# capability: what it learns goes into the repository's development docs and code comments.
knowledge: none
capabilities:
  oats.developer: { from: here }      # the developer role: understand the spec, build it, prove it, hand it back
  oats.build: { from: here }          # the build skills: execution, worktrees, test first, review loop, the PR
  oats.landing-rules: { from: here }  # how work lands here: the lane map, the agreements, who merges
launch: { harness: claude, model: claude-opus-5-5 }   # the role's preference; each machine may override it
