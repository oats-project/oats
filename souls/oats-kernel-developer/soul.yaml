schemaVersion: 2
name: oats-kernel-developer
description: "Deprecated: new work spawns oats-developer; this soul resolves until its removal in a change of its own. OATS kernel and CLI developer: owns lib/ and bin/oats.mjs (workspace model, capabilities, souls and instances, spawn and retire, hooks, packages, teams, schedules and triggers)."
# A developer: its product is reviewed changes on its own branch.
work: worktree
# oats.core and messaging come from the workspace defaults. A developer has no knowledge
# capability: what it learns goes into the repository's development docs and code comments.
knowledge: none
capabilities:
  oats.developer: { from: here }      # spec, parallel execution, consolidation, the code-reviewer loop
  oats.landing-rules: { from: here }  # how work lands here: the lane map, the agreements, who merges
launch: { harness: claude, model: claude-opus-5-5 }   # the role's preference; each machine may override it
