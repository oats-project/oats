name: Team image

on:
  pull_request:
  workflow_dispatch:
    inputs:
      default_payload_proof:
        description: Compare registry-installed payloads with and without the context mount
        type: boolean
        default: false
      packed_kernel:
        description: Verify the packed HEAD kernel (requires the compatible image baseline)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: team-image-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Team image / amd64 acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AGENT_IMAGE: oats-team-agent:${{ github.event.pull_request.head.sha || github.sha }}
      EGRESS_IMAGE: oats-team-egress:${{ github.event.pull_request.head.sha || github.sha }}
      TEAM_IMAGE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      # The PR's image inputs and acceptance script must come from its head,
      # rather than GitHub's synthetic merge commit or the default branch.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # The receiver's --credential mode against a real root-owned tree. sudo -n
      # fails the step where root is unavailable: it never skips.
      - name: Prove the credential receiver against a root-owned tree
        run: sudo -n python3 -I test/credential-receiver-root.py

      - name: Check packed inputs and workflow contracts for the manual proof
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.default_payload_proof }}
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --test test/team-image-packed-kernel.test.mjs test/team-image-release-context.test.mjs test/team-image-workflow.test.mjs test/workflow-no-cache.test.mjs

      - name: Build the reviewed image
        run: docker build --platform linux/amd64 --build-arg "TEAM_IMAGE_SOURCE_SHA=$TEAM_IMAGE_SOURCE_SHA" --tag "$AGENT_IMAGE" container/agent

      - name: Accept the real container
        id: accept
        run: bash .github/scripts/team-image-accept.sh

      # A derived image's declared child is proved with a fixture from the test
      # tree, built from the image accepted above, never from a registry. It
      # takes the same unmodified acceptance with its switch.
      - name: Build the fixture child image from the reviewed image
        run: docker build --platform linux/amd64 --build-arg "AGENT_IMAGE=$AGENT_IMAGE" --tag "$AGENT_CHILD_IMAGE" test/fixtures/agent-child
        env:
          AGENT_CHILD_IMAGE: oats-team-agent-child:${{ github.event.pull_request.head.sha || github.sha }}

      - name: Accept the real container with the declared child
        run: bash .github/scripts/team-image-accept.sh
        env:
          AGENT_IMAGE: oats-team-agent-child:${{ github.event.pull_request.head.sha || github.sha }}
          AGENT_CHILD: fixture
          AGENT_CHILD_FRAGMENT: test/fixtures/agent-child/compose.agent.child.yaml

      # Wrapper, policy/proxy and probes all come from the reviewed checkout.
      # Local image content IDs bind the disposable proof to these exact builds.
      - name: Build the reviewed egress image
        run: docker build --platform linux/amd64 --build-arg "TEAM_IMAGE_SOURCE_SHA=$TEAM_IMAGE_SOURCE_SHA" --file container/agent/egress/Dockerfile --tag "$EGRESS_IMAGE" container/agent

      - name: Verify both deploy manifests and run the extracted scripts
        run: node .github/scripts/team-image-deploy-check.mjs

      - name: Prove legacy egress image and ingress controls
        run: |
          sh test/agent-egress-image.sh "$EGRESS_IMAGE"
          python3 test/agent-egress-ingress-image.py "$EGRESS_IMAGE"
          python3 test/agent-egress-humanrole-ingress-image.py "$EGRESS_IMAGE"

      # The live check depends on public origins' availability, so a PR runs it
      # only when it changes the egress component or the check itself.
      - name: Decide whether the live named-origins check runs
        id: named-origins
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" != pull_request ]; then echo run=true >> "$GITHUB_OUTPUT"; exit 0; fi
          git fetch --quiet --no-tags --depth=1 origin "$BASE_SHA"
          changed=$(git diff --name-only "$BASE_SHA" HEAD -- container/agent/egress test/agent-egress-named-origins-image.py)
          if [ -n "$changed" ]; then echo run=true >> "$GITHUB_OUTPUT"; else echo run=false >> "$GITHUB_OUTPUT"; fi

      - name: Prove deployment-named external origins over real public TLS
        if: ${{ steps.named-origins.outputs.run == 'true' }}
        run: python3 test/agent-egress-named-origins-image.py "$EGRESS_IMAGE" "$AGENT_IMAGE"

      - name: Prove full and declared-role Compose boundaries
        run: |
          for roles in full aweb,registry aweb,registry,secrets aweb,logs,registry,secrets; do
            python3 test/agent-egress-boundary-image.py "$EGRESS_IMAGE" "$AGENT_IMAGE" "$roles"
          done

      # One runner, two Compose projects on disjoint networks. The probe and the
      # witness run from the deploy copy extracted from the reviewed egress image.
      - name: Prove the split agent/services boundary and services witness
        run: python3 test/agent-egress-boundary-image.py "$EGRESS_IMAGE" "$AGENT_IMAGE" split

      # Four container groups on one runner: shared plus three that each hold
      # one credential installed through the receiver. Every ordered pair is
      # proved isolated, then four mutant legs must each fail a named row.
      - name: Prove credential groups isolate each other
        run: python3 test/agent-credential-groups-image.py "$AGENT_IMAGE"

      - name: Compare the default installed payload across the mount seam
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.default_payload_proof }}
        run: bash .github/scripts/team-image-default-proof.sh
        env:
          ACCEPTED_IMAGE_ID: ${{ steps.accept.outputs.image-id }}

      - name: Install the registry copy tool
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo
          printf 'Skopeo package: `%s`\n' "$(dpkg-query -W -f='${Version}' skopeo)" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify export and registry manifest preparation without publishing
        run: bash .github/scripts/team-image-publish.sh --verify
        env:
          ACCEPTED_IMAGE_ID: ${{ steps.accept.outputs.image-id }}

  # Baseline guards pass; automatic packed-kernel PR verification remains
  # a separate change. Keep this proof explicitly manual-only.
  packed:
    name: Team image / packed kernel (manual)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.packed_kernel }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AGENT_IMAGE: oats-team-agent-packed:${{ github.sha }}
      TEAM_IMAGE_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Prepare the exact HEAD kernel context
        id: context
        run: node .github/scripts/team-image-pr-context.mjs
        env:
          TEAM_IMAGE_SOURCE_SHA: ${{ github.sha }}

      # The context is closed HEAD input plus the verified public kernel pack;
      # npm config/cache live outside it. Retain its private .dockerignore too.
      - name: Retain packed image inputs and HEAD inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: team-image-packed-inputs
          path: |
            ${{ steps.context.outputs.context }}
            ${{ steps.context.outputs.inventory }}
            ${{ steps.context.outputs.metadata }}
          include-hidden-files: true
          if-no-files-found: error

      - name: Build the HEAD kernel image
        run: docker build --platform linux/amd64 --build-arg "TEAM_IMAGE_SOURCE_SHA=$TEAM_IMAGE_SOURCE_SHA" --tag "$AGENT_IMAGE" "$TEAM_IMAGE_BUILD_CONTEXT"
        env:
          TEAM_IMAGE_BUILD_CONTEXT: ${{ steps.context.outputs.context }}

      - name: Accept the real container and installed HEAD files
        id: accept
        run: bash .github/scripts/team-image-accept.sh
        env:
          TEAM_IMAGE_PACKED_INVENTORY: ${{ steps.context.outputs.inventory }}
          TEAM_IMAGE_PACKED_INVENTORY_DIGEST: ${{ steps.context.outputs.inventory-digest }}

      - name: Install and record the registry copy tool
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo
          printf 'Skopeo package: `%s`\n' "$(dpkg-query -W -f='${Version}' skopeo)" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the accepted packed image without publishing
        run: bash .github/scripts/team-image-publish.sh --verify
        env:
          ACCEPTED_IMAGE_ID: ${{ steps.accept.outputs.image-id }}
