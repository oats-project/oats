name: Release

# Tag-driven release: push a tag `vX.Y.Z` (on a commit reachable from main)
# and this workflow builds and validates EVERYTHING from the exact tag SHA,
# then publishes: npm (root, then pi), then the GitHub Release (Desktop
# artifacts + checksums), then opens the version-bump PR for a maintainer to
# review and merge. The workflow never merges into main itself.
#
# Binding ordering (desktop-dist contract):
#   1. checkout the EXACT tag SHA (never a branch ref);
#   2. derive X.Y.Z from the tag into root, packages/pi, and packages/desktop
#      manifests/locks (`npm version --no-git-tag-version --allow-same-version`);
#   3. run ALL build/test/smoke steps — kernel tests (six parallel shards of
#      the bumped tree, like PR CI), pack checks, tarball clean-room smoke,
#      Desktop build + artifact inventory — BEFORE any publication;
#   4. publish @awebai/oats, then @awebai/oats-pi;
#   5. create the public GitHub Release LAST (after npm), attaching Desktop
#      artifacts, SHA256SUMS.txt, and provenance attestations;
#   6. open the bump PR covering all three package manifests/locks.
# A failed GitHub publication is retried from the same tag/assets — never
# retagged.
#
# Requires the repo secret NPM_TOKEN: a granular npm automation token with
# read/write on the @awebai packages (Settings → Secrets → Actions).

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write
  attestations: write
  # The publish job's last step opens the version-bump PR with github.token.
  # Without this the step fails at createPullRequest after everything is
  # published, and the release run ends red. It also needs the repository
  # setting "Allow GitHub Actions to create and approve pull requests".
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------- npm side
  # The suite is ~9 min serial on a 2-vCPU runner; six shards run it in
  # parallel (node --test --test-shard), as pull-request.yml does, beside
  # build-and-test. Each shard tests the tag SHA with the tag-derived version
  # applied, exactly as the serial run did; publication waits for every shard.
  tests:
    name: tests (shard ${{ matrix.shard }}/6)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          # The workspace-layout guard reads ancestor commits (git cat-file/show).
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Derive version from tag
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Bump all three packages (root, pi, desktop)
        run: |
          npm version "${{ steps.v.outputs.version }}" --no-git-tag-version --allow-same-version
          (cd packages/pi && npm version "${{ steps.v.outputs.version }}" --no-git-tag-version --allow-same-version)
          (cd packages/desktop && npm version "${{ steps.v.outputs.version }}" --no-git-tag-version --allow-same-version)

      - name: Test capability resolution and package commands
        run: |
          # Release checkout is fresh too: root tests need ajv and expose the
          # dev-installed pi binary through npm's node_modules/.bin PATH.
          npm ci --ignore-scripts
          # Root `npm test` discovers packages/desktop suites (jsdom/marked
          # imports) — install its dev deps like PR CI does; Electron binary
          # is not needed for tests.
          (cd packages/desktop && ELECTRON_SKIP_BINARY_DOWNLOAD=1 npm ci)
          npm test -- --test-shard=${{ matrix.shard }}/6

  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      # Exact tag SHA — releases are built from the tag, not from a moving
      # branch head. The on-main check below still gates provenance.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify the tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not on main — releases cut from main only."
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Derive version from tag
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Fail FAST (before any build spend, long before publication) if the
      # release notes file for this exact tag is missing — the final GitHub
      # Release step uses --notes-file docs/release-notes/<tag>.md, and a
      # tag/notes-filename mismatch must not be discovered post-npm-publish.
      - name: Verify release notes exist for this tag
        run: |
          NOTES="docs/release-notes/${GITHUB_REF_NAME}.md"
          [ -f "$NOTES" ] || { echo "::error::missing $NOTES — the release-notes filename must match the tag"; exit 1; }

      # A pull request writes its release-notes entry as a file under
      # docs/release-notes/next/, and the release-prep pull request moves
      # the entries into the notes file checked above
      # (docs/release-lane.md, "Release-notes entries"). Anything still
      # there is missing from the notes this tag publishes and would ship
      # in the kernel tarball's docs/: refuse, like the gate above, before
      # any build spend.
      - name: Verify no release-notes entry is left unassembled
        run: |
          NEXT="docs/release-notes/next"
          FOUND=""
          if [ -e "$NEXT" ]; then FOUND="$(ls -A "$NEXT" | tr '\n' ' ')"; fi
          if [ -n "$FOUND" ]; then
            echo "::error::unassembled release-notes entries under $NEXT: ${FOUND}— run \`node scripts/assemble-release-notes.mjs --tag ${GITHUB_REF_NAME}\` in the release-prep pull request"
            exit 1
          fi

      - name: Bump all three packages (root, pi, desktop)
        run: |
          npm version "${{ steps.v.outputs.version }}" --no-git-tag-version --allow-same-version
          (cd packages/pi && npm version "${{ steps.v.outputs.version }}" --no-git-tag-version --allow-same-version)
          (cd packages/desktop && npm version "${{ steps.v.outputs.version }}" --no-git-tag-version --allow-same-version)

      - name: Syntax-check all shipped JS
        # Shared with npm run check and the runnerless lane: recursive
        # capability libs, record, optional package scripts and release tools.
        run: node scripts/check-package-dry-runs.mjs --syntax-only

      - name: Check the kernel, the pi adapter and the project
        run: |
          # Release checkout is fresh too: the checks need ajv and the
          # dev-installed pi binary (npm's node_modules/.bin PATH). The test
          # suite runs in the sharded `tests` job.
          npm ci --ignore-scripts
          npm run check
          npm run check:pi
          npm run validate

      - name: Sanity-check tarballs
        run: |
          npm run pack:check
          npm pack --dry-run 2>&1 | grep -q "name: @awebai/oats" || { echo "::error::kernel pack check failed"; exit 1; }
          # never ship deployment state (top-level agents/ or a workspace config)
          if npm pack --dry-run 2>&1 | grep -E "^npm notice" | grep -qE " (agents/|oats-config\.yaml)"; then
            echo "::error::kernel tarball contains workspace state"; exit 1
          fi
          cd packages/pi
          npm pack --dry-run 2>&1 | grep -q "name: @awebai/oats-pi" || { echo "::error::adapter pack check failed"; exit 1; }

      - name: Clean-room tarball smoke (install packed artifacts outside the checkout)
        run: npm run smoke:tarball

      - name: Probe the Desktop CLI API v1 contract from the bumped tree
        run: node scripts/check-version-probe.mjs "${{ steps.v.outputs.version }}"

      - name: Upload bumped manifests for the version-bump PR
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bumped-manifests
          path: |
            package.json
            package-lock.json
            packages/pi/package.json
            packages/desktop/package.json
            packages/desktop/package-lock.json

  # ------------------------------------------------------------ Desktop side
  # Interface seam owned by the Desktop engineer: each matrix job checks out
  # the exact tag SHA, bumps packages/desktop to the tag version, builds the
  # ad-hoc signed installers via `npm run dist` (electron-builder internals are
  # the Desktop package's concern), and uploads a `desktop-<os>-<arch>` artifact
  # containing only the distributable files for that platform.
  #
  # packages/desktop deliverables for this seam (tracked in
  # test/release-workflow.test.mjs — the release cannot ship without them):
  #   * `npm test` — unit/integration tests (present);
  #   * `npm run dist` — electron-builder packaging producing
  #     dist/oats-desktop-* artifacts for the platform (DMG+ZIP on macOS,
  #     AppImage+DEB on Linux);
  #   * an installed-artifact smoke script (optional).
  desktop-build:
    needs: build-and-test
    strategy:
      # One leg's failure must NOT cancel the others (review: the Linux leg
      # failed fast and masked whether mac arm64/x64 actually built). Each
      # matrix leg reports independently.
      fail-fast: false
      matrix:
        include:
          - os: macos-15          # macOS arm64: DMG + ZIP
            arch: arm64
            builder_args: --arm64
          - os: macos-15          # macOS x64 cross-build: DMG + ZIP (no sunset macos-13 dependency)
            arch: x64
            builder_args: --x64
          - os: ubuntu-24.04      # Linux x64: AppImage + DEB
            arch: x64
            builder_args: --x64
    runs-on: ${{ matrix.os }}
    env:
      # Desktop installers ship AD-HOC signed — NOT Developer ID signed and
      # NOT notarized. Disable certificate discovery so no keychain identity
      # can leak in; ad-hoc signing needs no secrets.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Bump desktop to the tag version
        working-directory: packages/desktop
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      # macos-15 is arm64. The x64 leg cross-builds on it to avoid the
      # sunset/deprecating macos-13 runner; Rosetta executes the packaged x64
      # Electron + node-pty ABI probe and catches a wrong-arch native module.
      - name: Install Rosetta (macOS x64 cross-build only)
        if: runner.os == 'macOS' && matrix.arch == 'x64'
        run: sudo softwareupdate --install-rosetta --agree-to-license

      # The Linux leg's launch phase onboards a fixture deployment with this
      # repository's kernel, which needs the root dependencies (build-installers.yml
      # installs both too).
      - name: Install root deps (the launch fixture runs the kernel)
        run: npm ci

      - name: Build Desktop distributables
        working-directory: packages/desktop
        run: |
          npm ci
          npm test
          npm run dist -- ${{ matrix.builder_args }}

      # Contract (macos-correct-installers): BOTH packaged mac .app bundles
      # must carry a COMPLETE ad-hoc signature (v0.18.2 arm64 shipped an
      # incomplete linker-generated one — "code has no resources but signature
      # indicates they must be present" — and x64 shipped unsigned). Gate the
      # packaged app with strict deep codesign verification BEFORE smoke and
      # artifact upload. This run-block must stay byte-identical to the one in
      # build-installers.yml (test/release-workflow.test.mjs enforces both).
      - name: Verify macOS ad-hoc signature (strict deep codesign)
        if: runner.os == 'macOS'
        working-directory: packages/desktop
        run: |
          APP="$(find dist -maxdepth 2 -name '*.app' -print -quit)"
          [ -n "$APP" ] || { echo "::error::no packaged .app found under dist/"; exit 1; }
          echo "strict deep codesign verification: $APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      # Release and build-only CI run the SAME proven smoke: artifact
      # inventory + strict deep codesign verification of the packaged .app
      # (macOS legs — unconditional; rejects the v0.18.2 partial/absent
      # signature class) + spawn-helper mode + node-pty under the packaged
      # Electron ABI + the bundled backend, its liveness collector and every
      # module main imports, run headless as Node from app.asar and the shared
      # home beside it (dist-smoke phases 4 and 4b). The GUI launch is skipped
      # in this step: the Linux leg launches the window in the last step, and
      # on macOS it is operator/maintainer-owned post-publish acceptance;
      # headless CI has no reliable interactive windowserver for apps without
      # Developer ID trust.
      - name: Installed-artifact smoke (build-verify)
        working-directory: packages/desktop
        env:
          OATS_SMOKE_SKIP_LAUNCH: "1"
          OATS_SMOKE_BUILD_VERIFY: "1"
          OATS_SMOKE_TARGET_ARCH: ${{ matrix.arch }}
        run: npm run dist:smoke --if-present

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-${{ matrix.os }}-${{ matrix.arch }}
          path: packages/desktop/dist/oats-desktop-*
          if-no-files-found: error

      # The packaged WINDOW, on the Linux leg only: the same smoke once more,
      # WITH its launch phase (5), on a virtual display. Neither
      # OATS_SMOKE_SKIP_LAUNCH nor OATS_SMOKE_BUILD_VERIFY is set here. It is
      # the one claim the steps above cannot show: the page, over file:// under
      # its CSP, imports the shared home (packages/client, placed beside
      # app.asar as client/) from app.asar/renderer. `SHELL_OK nav=N` means
      # shell.mjs ran, and a module graph with one file that does not load does
      # not run at all. Last, after the upload, so a red launch leaves the
      # build-verify evidence and the artifacts as they are; it fails the job
      # all the same. macOS has no launch step: a runner gives an ad-hoc signed
      # app without Developer ID trust no interactive windowserver, so no
      # window comes up there, and a step that cannot pass would prove nothing.
      # The macOS window is launched on a real Mac, outside CI
      # (docs/release-lane.md, "Desktop release verification"). This step must
      # stay identical in build-installers.yml and release.yml
      # (test/release-workflow.test.mjs enforces both).
      - name: Packaged window launch (smoke with the launch phase, Linux only)
        if: runner.os == 'Linux'
        working-directory: packages/desktop
        env:
          OATS_SMOKE_TARGET_ARCH: ${{ matrix.arch }}
        run: |
          command -v xvfb-run >/dev/null || { sudo apt-get update && sudo apt-get install -y xvfb; }
          xvfb-run -a npm run dist:smoke

  # -------------------------------------------------------------- publication
  # Publication starts ONLY after every build/test/smoke job above is green
  # (every test shard included).
  publish:
    needs: [build-and-test, tests, desktop-build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Bump all three packages (root, pi, desktop)
        run: |
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
          (cd packages/pi && npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version)
          (cd packages/desktop && npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version)

      - name: Publish @awebai/oats (idempotent — skip if this exact version is live)
        run: |
          V="${GITHUB_REF_NAME#v}"
          if npm view "@awebai/oats@${V}" version >/dev/null 2>&1; then
            echo "@awebai/oats@${V} already published — skipping (same-tag retry)"
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @awebai/oats-pi (idempotent — skip if this exact version is live)
        run: |
          V="${GITHUB_REF_NAME#v}"
          if npm view "@awebai/oats-pi@${V}" version >/dev/null 2>&1; then
            echo "@awebai/oats-pi@${V} already published — skipping (same-tag retry)"
          else
            npm publish --access public
          fi
        working-directory: packages/pi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Download Desktop artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true

      - name: Checksums
        working-directory: release-assets
        run: shasum -a 256 * > SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
        with:
          subject-path: release-assets/*

      # GitHub Release LAST: npm is already published; a failure here is
      # retried from the same tag/assets (re-run this job — the npm publishes
      # above skip already-live versions), never retagged.
      - name: Create the GitHub Release (idempotent — upload assets if it exists)
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "release ${GITHUB_REF_NAME} exists — re-uploading assets (same-tag retry)"
            gh release upload "${GITHUB_REF_NAME}" release-assets/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" release-assets/* \
              --title "OATS ${GITHUB_REF_NAME}" \
              --notes-file docs/release-notes/${GITHUB_REF_NAME}.md \
              --verify-tag
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Open the version-bump PR (all three manifests)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json packages/pi/package.json packages/desktop/package.json packages/desktop/package-lock.json
          # A release cut from a main that was already aligned to the tag's
          # version (the v0.22.0 case) has nothing to bump; that is a finished
          # release, not a failure.
          if git diff --cached --quiet; then
            echo "manifests already at ${GITHUB_REF_NAME#v} on the tagged commit — no bump PR needed"
            exit 0
          fi
          # No [skip ci]: a pull request opened with github.token starts no
          # workflows by itself, and the marker would also stop the checks a
          # maintainer starts by closing and reopening it.
          git commit -m "release: ${GITHUB_REF_NAME} version bump"
          BRANCH="release-bump/${GITHUB_REF_NAME}"
          # Fully-qualify the destination ref: the publish job checks out the
          # exact tag SHA (ref: github.sha), so HEAD is DETACHED. Pushing
          # `HEAD:<name>` from a detached HEAD cannot infer refs/heads/ and
          # fails ("not a full refname"); `HEAD:refs/heads/<name>` is explicit
          # and works in both attached and detached HEAD.
          git push origin "HEAD:refs/heads/${BRANCH}"
          gh pr create --base main --head "${BRANCH}" \
            --title "release: ${GITHUB_REF_NAME} version bump" \
            --body "Automated version bump (root, pi, desktop) from the ${GITHUB_REF_NAME} release run. It waits for a maintainer to review and merge: the diff must be the version lines only. This pull request was opened by the workflow token, so no checks ran on it; close and reopen it to run them, and do not read missing checks as green."
          # Open only. The release run tested the bumped tree at the tagged
          # commit, not whatever main is by now, so merging is a maintainer's
          # reviewed act and never this job's.
        env:
          GH_TOKEN: ${{ github.token }}
