name: Agent chart
on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']
permissions:
  contents: read
jobs:
  chart:
    name: Helm 3 / render and admission acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Install checksum-pinned Helm 3
        shell: bash
        run: |
          curl --fail --silent --show-error --location https://get.helm.sh/helm-v3.19.2-linux-amd64.tar.gz -o "$RUNNER_TEMP/helm.tar.gz"
          echo "2114c9dea2844dce6d0ee2d792a9aae846be8cf53d5b19dc2988b5a0e8fec26e  $RUNNER_TEMP/helm.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/helm.tar.gz" -C "$RUNNER_TEMP" linux-amd64/helm
          echo "$RUNNER_TEMP/linux-amd64" >> "$GITHUB_PATH"
      - name: Cluster-free Helm and kubectl boundary tests
        run: node --test test/agent-chart.integration.mjs
