name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']

permissions:
  contents: read

concurrency:
  # A PR shares one group (stale runs cancel); each main commit gets its OWN group, so no
  # merge commit's run is queued behind or superseded by another (GitHub keeps one pending run per group).
  group: ci-${{ github.event.pull_request.number || github.sha }}
  # A PR's stale run is cancelled by its next push; main's runs never cancel each other:
  # with merge-then-fix, every merge commit's CI is the record that main was green.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unsupported-node:
    name: Node 20 / unsupported-node refusal
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No install: the refusal must load without the kernel or its dependencies.
      - name: Unsupported Node refuses every CLI path before startup
        run: node scripts/check-unsupported-node.mjs

  # The suite is ~470s serial on a 2-vCPU runner; six shards run it in parallel
  # (node --test --test-shard). Every shard installs the desktop deps, so no
  # Desktop suite is skipped.
  tests:
    name: Node 22 / tests (shard ${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
        with:
          # The workspace-layout guard reads the six import pins with `git cat-file`/`git show`;
          # those are ancestor commits a shallow checkout does not have (main red since f34207e9).
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install supported-node dependencies
        run: npm ci

      - name: Install desktop package dependencies
        # Root `npm test` discovers packages/desktop suites (jsdom/marked/
        # dompurify imports). The Electron binary is not needed for tests —
        # skip its download; postinstall builds the renderer vendor bundle
        # (esbuild) as part of ci.
        run: npm ci
        working-directory: packages/desktop
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Unit and integration tests
        run: npm test -- --test-shard=${{ matrix.shard }}/6

  verify:
    name: Node 22 / check, validate, pack, smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # The workspace-layout guard reads the six import pins with `git cat-file`/`git show`;
          # those are ancestor commits a shallow checkout does not have (main red since f34207e9).
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install supported-node dependencies
        run: npm ci

      - name: Install desktop package dependencies
        # Root `npm test` discovers packages/desktop suites (jsdom/marked/
        # dompurify imports). The Electron binary is not needed for tests —
        # skip its download; postinstall builds the renderer vendor bundle
        # (esbuild) as part of ci.
        run: npm ci
        working-directory: packages/desktop
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Kernel and CLI syntax
        run: npm run check

      - name: Pi adapter TypeScript syntax
        run: npm run check:pi

      - name: Generated package mirrors match their catalog pins
        run: node scripts/check-mirrors.mjs --verify

      - name: Schemas, manifests, config examples, and public links
        run: npm run validate

      - name: Dry-run both npm packages
        run: npm run pack:check

      - name: Clean-room packed-artifact smoke test
        run: npm run smoke:tarball

  # The release's desktop-build installs and tests inside packages/desktop only, with no
  # root install. Every shard above installs the root first, so a Desktop test that reaches a
  # root-only dependency (kernel code importing one) passes there and fails at the tag. This
  # job runs the Desktop suite the way the release does: NO step here installs at the
  # repository root (test/continuous-integration.test.mjs pins it against desktop-build).
  desktop-standalone:
    name: Node 22 / Desktop tests, Desktop-only install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Shallow, as desktop-build checks out.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install desktop package dependencies only
        # The tests do not need the Electron binary; one that did would fail here, before a tag.
        run: npm ci
        working-directory: packages/desktop
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Desktop tests
        run: npm test
        working-directory: packages/desktop

  # A fixture never inherits the session that runs the suite (awebai/oats#972). The shards above
  # run with none of a session's variables, so a test that reads one passes there and fails for
  # the next developer agent, whose session has them all. This job is CI's own session: it runs
  # the suites that followed one with every such variable set to a value that cannot work
  # (scripts/test-session-inheritance.mjs; the names are the test helpers' own definition).
  session-inheritance:
    name: Node 22 / tests under a poisoned session
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Checked out and installed as a shard is, less the Desktop dependencies: none of these
      # suites loads a Desktop module.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install supported-node dependencies
        run: npm ci

      - name: The suites that followed a session variable, with every one poisoned
        run: npm run test:session

  # The lifecycle of a home on a session provider, every schedule (docs/design/
  # 2026-11-20-provider-home-lifecycle.md; test/session-provider-explorer.test.mjs): for each verb,
  # the kernel ends at each seam it passes, then another verb runs, then an input, and the page's
  # invariants are checked. The shards above run a seeded sample of the schedules, in seconds; this
  # job runs them all, on every push, because a sample is what lets the next ordering through.
  provider-lifecycle:
    name: Node 22 / session-provider lifecycle, every schedule
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install supported-node dependencies
        run: npm ci

      - name: Every schedule of the session-provider lifecycle
        run: npm run test:provider-lifecycle

  # The one check to wait on (the name reviewers and merge tooling already know).
  gate:
    name: Node 22 / test, validate, pack, smoke
    needs: [tests, verify, desktop-standalone, session-inheritance, unsupported-node, provider-lifecycle]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All shards and gates passed
        run: |
          test "${{ needs.tests.result }}" = success
          test "${{ needs.verify.result }}" = success
          test "${{ needs.desktop-standalone.result }}" = success
          test "${{ needs.session-inheritance.result }}" = success
          test "${{ needs.unsupported-node.result }}" = success
          test "${{ needs.provider-lifecycle.result }}" = success
