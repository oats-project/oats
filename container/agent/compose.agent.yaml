# Include after the bundle's compose.yaml. The installer creates agents.
services:
  agent:
    image: ${AGENT_IMAGE:?Set AGENT_IMAGE}
    container_name: oats-agent-${TEAM:?Set TEAM}
    user: "${AGENT_UID:-20001}:${AGENT_GID:-20001}"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    privileged: false
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,mode=1777
    pids_limit: ${AGENT_PIDS:?Set AGENT_PIDS}
    mem_limit: ${AGENT_MEMORY:?Set AGENT_MEMORY}
    cpus: ${AGENT_CPUS:?Set AGENT_CPUS}
    restart: unless-stopped
    # oats host run gives each agent's harness 20 s to end after SIGTERM.
    stop_grace_period: 45s
    # Unhealthy means sshd no longer listens; Docker does not restart on that alone.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/2222"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - type: bind
        source: ${TEAM_STATE_DIR:?Set TEAM_STATE_DIR}
        target: /state
        bind: { create_host_path: false }
      - type: bind
        source: ${TEAM_LOGIN_DIR:?Set TEAM_LOGIN_DIR}
        target: /etc/agent-login
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${AUTHORIZED_KEYS_FILE:?Set AUTHORIZED_KEYS_FILE}
        target: /etc/agent-ssh/authorized_keys
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${RESOLV_CONF_FILE:?Set RESOLV_CONF_FILE}
        target: /etc/resolv.conf
        read_only: true
        bind: { create_host_path: false }
    networks:
      agents:
        ipv4_address: ${AGENT_IP:?Set AGENT_IP}

networks:
  agents:
    external: true
    name: ${AGENTS_NETWORK:?Set AGENTS_NETWORK}
