# Include only for a credential group: the directory oats-login-receive --credential
# writes, root:<runtime GID> 0750 with root:<runtime GID> 0440 files.
services:
  agent:
    volumes:
      - type: bind
        source: ${TEAM_CREDENTIALS_DIR:?Set TEAM_CREDENTIALS_DIR}
        target: /etc/agent-credentials
        read_only: true
        bind: { create_host_path: false }
